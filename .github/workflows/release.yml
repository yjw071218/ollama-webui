# Builds Ollama WebUI for Windows, Linux and macOS and attaches them to a
# GitHub Release. Every package is started once on its own OS before release
# (scripts/desktop/stage.mjs --check); a package that cannot boot fails the run.
# Trigger: push a tag such as v0.1.2   (git tag v0.1.2 && git push origin v0.1.2)
# or run it by hand from the Actions tab.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.2)'
        required: true

permissions:
  contents: write

env:
  NODE_RUNTIME: '24.14.1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME }}
          cache: npm

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Icon from the app logo
        run: |
          npm i --no-save @resvg/resvg-js
          node scripts/desktop/make-icon.mjs

      - name: Stage files and bundle Node
        shell: pwsh
        run: |
          $stage = 'installer/stage'
          New-Item -ItemType Directory -Force "$stage/runtime" | Out-Null
          $zip = "node-v$env:NODE_RUNTIME-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_RUNTIME/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath node-tmp
          Copy-Item "node-tmp/node-v$env:NODE_RUNTIME-win-x64/node.exe" "$stage/runtime/"
          # npm too: the first run installs Codex with it (server/first-run.mjs).
          New-Item -ItemType Directory -Force "$stage/runtime/node_modules" | Out-Null
          Copy-Item -Recurse "node-tmp/node-v$env:NODE_RUNTIME-win-x64/node_modules/npm" "$stage/runtime/node_modules/"
          Copy-Item "node-tmp/node-v$env:NODE_RUNTIME-win-x64/npm.cmd", "node-tmp/node-v$env:NODE_RUNTIME-win-x64/npx.cmd" "$stage/runtime/"
          # Started with the node.exe that ships, the way the installed copy runs.
          $env:CHECK_NODE = (Resolve-Path "$stage/runtime/node.exe").Path
          node scripts/desktop/stage.mjs $stage --check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          }
          iscc /DAppVersion=${{ steps.v.outputs.version }} installer/ollama-webui.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/OllamaWebUI-Setup-*.exe

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest,     target: darwin-arm64 }
          - { os: macos-15-intel,   target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME }}
          cache: npm

      - name: Version
        id: v
        shell: bash
        run: |
          v='${{ github.event.inputs.version }}'
          [ -n "$v" ] || v='${{ github.ref_name }}'
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Stage, bundle Node and check
        shell: bash
        run: |
          set -euo pipefail
          pkg="OllamaWebUI-${{ steps.v.outputs.version }}-${{ matrix.target }}"
          stage="pkg/$pkg"
          mkdir -p "$stage/runtime/bin" release
          node_dir="node-v$NODE_RUNTIME-${{ matrix.target }}"
          curl -fsSL "https://nodejs.org/dist/v$NODE_RUNTIME/$node_dir.tar.gz" | tar xz
          cp "$node_dir/bin/node" "$stage/runtime/bin/node"
          cp "$node_dir/LICENSE" "$stage/runtime/NODE-LICENSE"
          # npm too: the first run installs Codex with it (server/first-run.mjs).
          mkdir -p "$stage/runtime/lib/node_modules"
          cp -R "$node_dir/lib/node_modules/npm" "$stage/runtime/lib/node_modules/"
          cp installer/ollama-webui.sh "$stage/"
          chmod +x "$stage/runtime/bin/node" "$stage/ollama-webui.sh"
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            cp "installer/Ollama WebUI.command" "$stage/"
            chmod +x "$stage/Ollama WebUI.command"
          fi
          CHECK_NODE="$PWD/$stage/runtime/bin/node" node scripts/desktop/stage.mjs "$stage" --check
          tar -C pkg -czf "release/$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*.tar.gz

  publish:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Version
        id: v
        run: |
          v='${{ github.event.inputs.version }}'
          [ -n "$v" ] || v='${{ github.ref_name }}'
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Ollama WebUI ${{ steps.v.outputs.version }}
          files: out/*
          generate_release_notes: true
