name: native-clients
on:
  workflow_dispatch:
  push:
    paths: ['native/**', 'src/capture.js', '.github/workflows/native-clients.yml']
  pull_request:
    paths: ['native/**', 'src/capture.js', '.github/workflows/native-clients.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: native/desktop
      - run: node --test native/tests/*.test.mjs
      - run: node native/tests/desktop-smoke.mjs
      - run: npm run pack
        working-directory: native/desktop
      - name: Packaged app smoke test
        shell: pwsh
        run: |
          $env:NATIVE_EXE = (Resolve-Path 'native/artifacts/windows/win-unpacked/Ollama WebUI Client.exe').Path
          node native/tests/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: native/artifacts/windows/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon assembleDebug lintDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          # CI debug identity is intentionally different from the signed public APK.
          name: android-client-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
