<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Ollama WebUI">
  <!--
    Two arcs closing on a centre.

    Four marks came before this one, each failing for its own reason. A
    lightning bolt built from fifteen blurred ellipses, in a purple used
    nowhere else in the app, which at 16px was a smudge. Two bars, legible and
    dull, which read as an equals sign. A speech bubble, which on a Korean
    desktop is KakaoTalk. And plain concentric rings, which are a bullseye:
    perfectly symmetric, so there is nothing for the eye to follow.

    The fix for the last one is the grading. The outer arc runs most of a turn
    and the inner one a little over a third, both opening at the same angle, so
    the shape turns inward instead of sitting still.

    Spacing is set by the smallest size rather than the largest, because at
    16px one unit of this grid is half a pixel and anything closer merges.
  -->
  <rect width="32" height="32" rx="8" fill="#D97757"/>
  <g fill="none" stroke="#F7F5F0" stroke-linecap="round">
      <path d="M15 4.54A11.5 11.5 0 1 1 6.58 9.4" stroke-width="2.6"/>
      <path d="M15.44 9.62A6.4 6.4 0 0 1 20.53 20.53" stroke-width="2.8"/>
    </g>
    <circle cx="16" cy="16" r="2.3" fill="#F7F5F0"/>
</svg>
