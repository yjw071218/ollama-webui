<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ollama WebUI">
  <!--
    The same mark, drawn for a home screen.

    The arcs are the favicon's, placed under a transform rather than redrawn,
    so the two cannot drift apart: scripts/logo.test.mjs compares the paths.

    "Maskable" means the launcher crops it to whatever shape it likes, and
    anything outside the middle 80% may be cut away. The safe zone is a circle
    of radius 205 about the centre; this mark reaches 179.20000000000002. The accent runs
    to the full bleed because the part that gets cropped has to be something
    rather than transparent.
  -->
  <rect width="512" height="512" fill="#D97757"/>
  <g transform="translate(32 32) scale(14)">
    <g fill="none" stroke="#F7F5F0" stroke-linecap="round">
      <path d="M15 4.54A11.5 11.5 0 1 1 6.58 9.4" stroke-width="2.6"/>
      <path d="M15.44 9.62A6.4 6.4 0 0 1 20.53 20.53" stroke-width="2.8"/>
    </g>
    <circle cx="16" cy="16" r="2.3" fill="#F7F5F0"/>
  </g>
</svg>
