<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>Ollama WebUI</title><link rel="stylesheet" href="browser.css"><header><button data-action="close" class="close" title="대화로 돌아가기 (Ctrl+W)" data-en-title="Back to the chat (Ctrl+W)" data-en="Chat">✕ 대화로</button><button data-action="back" title="뒤로 (Alt+←)" data-en-title="Back (Alt+Left)" disabled>←</button><button data-action="forward" title="앞으로 (Alt+→)" data-en-title="Forward (Alt+Right)" disabled>→</button><button data-action="reload" id="reload" title="새로고침 (F5)" data-en-title="Reload (F5)">↻</button><form id="go"><input id="address" spellcheck="false" autocomplete="off" aria-label="주소" data-en-label="Address"></form><form id="ask"><input id="question" spellcheck="false" autocomplete="off" placeholder="이 페이지에 대해 AI에게 질문…" data-en-placeholder="Ask AI about this page…" aria-label="AI에게 질문" data-en-label="Ask AI"></form><button data-action="dock" id="dock" title="채팅을 옆에 열기/닫기" data-en-title="Show or hide the chat beside">채팅 ▸</button><button data-action="external" title="기본 브라우저로 열기" data-en-title="Open in your browser" data-en="Browser">브라우저로</button></header><script src="browser-ui.mjs" type="module"></script></html>
