<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI에게 묻기</title>
<style>
:root{font-family:system-ui,sans-serif;color:#292724;background:#faf9f6;--line:#e9e5de;--muted:#817b72;--soft:#f0ede7;--accent:#a95135}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;border-radius:20px}body{display:flex;flex-direction:column;padding:14px;gap:10px}header{display:flex;align-items:center;gap:8px}h1{font-size:15px;letter-spacing:-.4px;margin:0;flex:1}header span{font-size:10px;color:var(--muted);font-weight:400}button,select,textarea{font:inherit;color:inherit}button{border:0;background:var(--soft);border-radius:11px;padding:8px 11px;cursor:pointer;min-height:36px}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon{font-size:20px;line-height:1;background:transparent;padding:7px;min-width:36px}#selection{margin:0;padding:9px 11px;border-left:2px solid #d6a48f;background:var(--soft);border-radius:0 9px 9px 0;white-space:pre-wrap;overflow:auto;max-height:54px;font-size:12px;line-height:1.5;flex-shrink:0}.actions{display:flex;gap:6px}.actions button{flex:1;font-size:12px;padding:6px 3px}#thread{flex:1;min-height:35px;overflow:auto;overscroll-behavior:contain;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.answer,.question{white-space:pre-wrap;margin:0 0 10px}.question{background:var(--soft);border-radius:10px;padding:8px 10px;margin-left:22px;font-size:12px}.answer{padding:2px}#empty{color:var(--muted);text-align:center;padding:12px 0;font-size:12px}footer{display:flex;align-items:center;gap:6px}select{min-width:0;flex:1;width:0;border:0;background:var(--soft);border-radius:8px;font-size:11px;padding:7px}#status{font-size:11px;color:var(--muted);margin:0;min-height:16px}form{display:flex;align-items:flex-end;gap:7px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;padding:5px;font-size:13px;line-height:1.45;max-height:65px;outline:none}#send{background:var(--accent);color:white;font-size:12px;white-space:nowrap}#copy,#retry{font-size:11px;padding:5px 9px;min-height:30px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{color:#eee9e1;background:#242321;--line:#45413b;--muted:#aaa398;--soft:#302e2b;--accent:#ba7052}}@media(max-height:300px){body{gap:5px;padding:9px}#selection{max-height:30px}.actions button{min-height:30px}header span{display:none}}
</style></head><body>
<header><h1>AI에게 묻기 <span>· 임시 대화</span></h1><button class="icon" id="close" aria-label="닫기">×</button></header>
<blockquote id="selection" hidden></blockquote>
<nav class="actions" aria-label="빠른 질문"><button data-prompt="핵심만 간결하게 요약해 줘.">요약</button><button data-prompt="한국어는 영어로, 그 외 언어는 한국어로 번역해 줘.">번역</button><button data-prompt="이 내용을 쉽게 설명해 줘.">설명</button><button data-prompt="맞춤법과 문장을 다듬고 고친 글만 보여 줘.">다듬기</button></nav>
<main id="thread" aria-label="질문과 답변"><div id="empty">선택한 글에 대해 바로 물어보세요.</div></main>
<p id="status" role="status">모델 불러오는 중…</p>
<footer><select id="model" aria-label="답변 모델" disabled></select><button id="retry" hidden>재연결</button><button id="open" hidden>앱 열기</button><button id="copy" disabled>복사</button></footer>
<form id="form"><textarea id="input" rows="1" maxlength="12000" aria-label="질문" placeholder="무엇이 궁금한가요?"></textarea><button id="send" type="submit" disabled>보내기</button></form>
<script src="/__native/quickask.js"></script></body></html>
