<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI에게 묻기</title>
<style>
/* The app's own palette: warm paper / warm dark, terracotta accent. */
:root{
  font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif;
  --bg:#faf9f5;--panel:#ffffff;--ink:#24211d;--muted:#78716a;--soft:#f0eee6;--line:#e3ded2;
  --accent:#d97757;--accent-ink:#ffffff;--accent-soft:#d977571f;
  color:var(--ink);background:transparent
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1f1e1b;--panel:#262420;--ink:#eee9e0;--muted:#a09a8f;--soft:#2e2c27;--line:#3a3731;
  --accent:#d97757;--accent-ink:#1a1916;--accent-soft:#d9775726
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);border-radius:22px;border:1px solid var(--line);overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
button{border:0;background:var(--soft);border-radius:10px;padding:7px 11px;cursor:pointer;min-height:34px;transition:background .15s,transform .1s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* Header: the handle the window is moved by. */
header{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--panel);border-bottom:1px solid var(--line)}
header.dragging{cursor:grabbing}
.grip{position:absolute;left:50%;top:4px;width:34px;height:4px;margin-left:-17px;border-radius:2px;background:var(--line)}
.logo{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.logo svg{width:16px;height:16px}
.heading{flex:1;min-width:0}
h1{font-size:14.5px;letter-spacing:-.3px;margin:0;font-weight:650}
.sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.icon{background:transparent;padding:0;width:32px;min-height:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon:hover{background:var(--soft);color:var(--ink)}
.icon svg{width:17px;height:17px}

.body{flex:1;display:flex;flex-direction:column;gap:9px;padding:10px 12px 12px;min-height:0}

/* What the AI can see. */
#screen{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:11.5px;flex-shrink:0}
#screen .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
#screen.off .dot{background:var(--muted);box-shadow:none}
#screen .what{flex:1;min-width:0;overflow:hidden}
#screen .what b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screen .what span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
#screen img{width:30px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none}
#screen button{font-size:11px;min-height:28px;padding:4px 9px;border-radius:8px}
#screenToggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

#selection{margin:0;padding:8px 10px;border-left:2px solid var(--accent);background:var(--soft);border-radius:0 9px 9px 0;white-space:pre-wrap;overflow:auto;max-height:54px;font-size:12px;line-height:1.5;flex-shrink:0}
.actions{display:flex;gap:6px;flex-shrink:0}
.actions button{flex:1;font-size:12px;padding:5px 3px;min-height:30px;border:1px solid var(--line);background:transparent;border-radius:999px}
.actions button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
#thread{flex:1;min-height:40px;overflow:auto;overscroll-behavior:contain;font-size:13.5px;line-height:1.65;overflow-wrap:anywhere;scrollbar-width:thin}
.answer,.question{white-space:pre-wrap;margin:0 0 10px}
.question{background:var(--soft);border-radius:14px 14px 4px 14px;padding:8px 11px;margin-left:28px;font-size:12.5px}
.answer{padding:2px 2px 4px}
#empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:12px;line-height:1.6}
footer{display:flex;align-items:center;gap:6px;flex-shrink:0}
select{min-width:0;flex:1;width:0;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:11px;padding:6px}
#status{font-size:10.5px;color:var(--muted);margin:0;min-height:15px;overflow-wrap:anywhere}
form{display:flex;align-items:flex-end;gap:7px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);flex-shrink:0;transition:border-color .15s}
form:focus-within{border-color:var(--accent)}
textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;padding:6px 0;font-size:13.5px;line-height:1.45;max-height:72px;outline:none}
#send{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;white-space:nowrap;border-radius:11px;min-width:54px}
#copy,#retry,#open{font-size:11px;padding:4px 9px;min-height:28px}
@media(max-height:330px){.body{gap:5px;padding:7px 9px}#selection{max-height:30px}.sub{display:none}#screen img{display:none}}
</style></head><body>
<header id="handle">
  <span class="grip" aria-hidden="true"></span>
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/><path d="M19 15c.3 1.9 1.1 2.7 3 3-1.9.3-2.7 1.1-3 3-.3-1.9-1.1-2.7-3-3 1.9-.3 2.7-1.1 3-3z" opacity=".7"/></svg></span>
  <div class="heading"><h1>AI에게 묻기</h1><span class="sub">임시 대화 · 위쪽을 끌어 창 이동</span></div>
  <button class="icon" id="bubble" aria-label="버튼으로 접기" title="버튼으로 접기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="icon" id="close" aria-label="닫기" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>
<div class="body">
  <div id="screen" class="off" hidden>
    <span class="dot" aria-hidden="true"></span>
    <img id="shot" alt="" hidden>
    <div class="what"><b id="screenTitle">화면 인식이 꺼져 있습니다</b><span id="screenSub">켜면 지금 보던 화면을 AI가 함께 봅니다</span></div>
    <button id="screenToggle" aria-pressed="true" hidden>포함</button>
    <button id="screenEnable" hidden>켜기</button>
  </div>
  <blockquote id="selection" hidden></blockquote>
  <nav class="actions" aria-label="빠른 질문"><button data-prompt="핵심만 간결하게 요약해 줘.">요약</button><button data-prompt="한국어는 영어로, 그 외 언어는 한국어로 번역해 줘.">번역</button><button data-prompt="이 내용을 쉽게 설명해 줘.">설명</button><button data-prompt="맞춤법과 문장을 다듬고 고친 글만 보여 줘.">다듬기</button></nav>
  <main id="thread" aria-label="질문과 답변"><div id="empty">지금 보고 있는 화면이나 선택한 글에 대해 바로 물어보세요.</div></main>
  <p id="status" role="status">모델 불러오는 중…</p>
  <footer><select id="model" aria-label="답변 모델" disabled></select><button id="retry" hidden>재연결</button><button id="open" hidden>앱 열기</button><button id="copy" disabled>복사</button></footer>
  <form id="form"><textarea id="input" rows="1" maxlength="12000" aria-label="질문" placeholder="무엇이 궁금한가요?"></textarea><button id="send" type="submit" disabled>보내기</button></form>
</div>
<script src="/__native/quickask.js"></script></body></html>
